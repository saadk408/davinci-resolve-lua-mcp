# Weekly dependency updates, grouped so one pull request carries them: the commit-SHA pins of the
# actions under .github/workflows (Dependabot rewrites the pin and the `# vN` comment) and the npm
# dependencies, runtime and dev. `@types/node` stays on its major: it is pinned to 20 on purpose so `tsc`
# rejects APIs newer than the engines floor (CLAUDE.md, TypeScript conventions). Majors of the
# other packages arrive as their own pull requests. Every PR still goes through the three
# required checks; nothing merges on its own. Security alerts are a repository setting, not this
# file.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
